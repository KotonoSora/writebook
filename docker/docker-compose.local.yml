name: storynest-local

services:
  writebook:
    image: storynest/local:latest
    build:
      context: ..
    container_name: storynest_local

    ports:
      - "8080:80"

    env_file:
      - ../.env.local

    environment:
      RAILS_ENV: development
      DISABLE_SSL: "true"

    volumes:
      - ../:/rails:cached
      - writebook_bin:/rails/bin

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  writebook_bin:
