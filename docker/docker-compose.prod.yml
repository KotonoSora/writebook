name: storynest-prod

services:
  writebook:
    image: storynest/prod:latest
    build:
      context: ..
    container_name: storynest_prod

    ports:
      - "8080:80"

    env_file:
      - ../.env.prod

    environment:
      RAILS_ENV: production
      DISABLE_SSL: "true"

    volumes:
      - writebook_storage:/rails/storage
      - writebook_db:/rails/db

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - storynest-net

volumes:
  writebook_storage:
  writebook_db:

networks:
  storynest-net:
    external: true
